x-stockflow-container-database: &stockflow-container-database postgresql+psycopg://stockflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/stockflow

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_DB: stockflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: *stockflow-container-database
      WRITE_TOKEN: ${WRITE_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  telegram-worker:
    profiles: ["telegram"]
    build: ./backend
    command: ["python", "-m", "app.telegram_worker"]
    environment:
      DATABASE_URL: *stockflow-container-database
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
