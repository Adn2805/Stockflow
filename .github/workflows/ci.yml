name: StockFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stockflow
          POSTGRES_DB: stockflow_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_ci_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://stockflow@127.0.0.1:5432/stockflow_ci_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: PostgreSQL regression suite
        working-directory: backend
        run: python -m pytest -ra --tb=short
      - name: HTTP concurrency correctness
        run: python benchmarks/concurrency.py --output benchmarks/local-results/concurrency.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, build, and test the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
           npm run test:demo
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stockflow-checks
          path: |
            benchmarks/local-results/concurrency.json
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
